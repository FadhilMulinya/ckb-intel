services:
  classifier-service:
    build:
      context: .
      dockerfile: classifier_service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-2}
      EXPLORER_API_URL: ${EXPLORER_API_URL:-https://mainnet-api.explorer.nervos.org/api/v1}
      EXPLORER_TIMEOUT_SECONDS: ${EXPLORER_TIMEOUT_SECONDS:-10}
      EXPLORER_MAX_RETRIES: ${EXPLORER_MAX_RETRIES:-1}
      EXPLORER_REQUEST_DELAY_MS: ${EXPLORER_REQUEST_DELAY_MS:-250}
      EXPLORER_LIVE_PAGE_SIZE: ${EXPLORER_LIVE_PAGE_SIZE:-50}
    volumes:
      - type: bind
        source: ${FROZEN_SQLITE_PATH:-./deployment-data/ckb_explorer.sqlite}
        target: /app/ckb_data/ckb_data_v2/ckb_explorer.sqlite
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  registry-service:
    build:
      context: .
      dockerfile: registry-service/Dockerfile
    restart: unless-stopped
    depends_on:
      classifier-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3000"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your external MongoDB Atlas URI}
      CLASSIFIER_SERVICE_URL: ${CLASSIFIER_SERVICE_URL:-http://classifier-service:8000}
      CLASSIFIER_TIMEOUT_MS: ${CLASSIFIER_TIMEOUT_MS:-20000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://demo.afriai.xyz,https://afriai.xyz}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.1/32}
      ANALYZE_RATE_LIMIT: ${ANALYZE_RATE_LIMIT:-5}
      ANALYZE_RATE_WINDOW_SECONDS: ${ANALYZE_RATE_WINDOW_SECONDS:-60}
      READ_RATE_LIMIT: ${READ_RATE_LIMIT:-60}
      READ_RATE_WINDOW_SECONDS: ${READ_RATE_WINDOW_SECONDS:-60}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# Private service connectivity with outbound Internet access for Atlas/Explorer.
# The fixed gateway identifies the host reverse proxy as seen by the registry.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}
          gateway: ${DOCKER_GATEWAY:-172.30.0.1}
